[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jomohan-mergeclash"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出合并适配器的冲突上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jomohan" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jomohan.github.io"
Repository = "https://github.com/jomohan/mergeclash"
Issues = "https://github.com/jomohan/mergeclash/issues"

[project.scripts]
mergeclash = "mergeclash:main"

[tool.setuptools]
py-modules = ["mergeclash"]
